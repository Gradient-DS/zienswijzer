name: Production build on IP + Domain

on:
  workflow_dispatch:
    inputs:
      ip:
        description: 'ip address of the production server'
        type: string
      domain:
        description: 'Domain of the production server'
        type: string
        default: aire-gradient.nl
      ssh_user:
        description: 'SSH user (leave empty to auto-detect: root, deploy, gradient)'
        type: string
        required: false
        default: ''
      api_version:
        description: 'API image tag to deploy'
        type: string
        default: latest
      frontend_version:
        description: 'Frontend image tag to deploy'
        type: string
        default: latest
      tls_mode:
        description: 'TLS: letsencrypt | static | skip'
        type: choice
        options:
          - letsencrypt
          - static
          - skip
        default: letsencrypt

env:
  SSH_PRIVATE_KEY_PROD: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
  GRADIENT_MAIL: ${{ secrets.GRADIENT_MAIL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for SSH (port 22)
        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          for i in {1..60}; do
            if (echo > /dev/tcp/$ip/22) >/dev/null 2>&1; then exit 0; fi
            echo "Waiting for SSH ($i/60) ..."; sleep 5
          done
          exit 1

      - name: Prepare SSH key
        id: ssh
        env:
          SSH_PRIVATE_KEY_PROD: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_PROD" > ~/.ssh/id_do
          chmod 600 ~/.ssh/id_do
          echo "key_path=$HOME/.ssh/id_do" >> $GITHUB_OUTPUT

      - name: Select SSH control user
        id: ctrl
        run: |
          set -euo pipefail
          IP=${{ inputs.ip }}
          KEY=${{ steps.ssh.outputs.key_path }}
          SPECIFIED_USER="${{ inputs.ssh_user }}"

          try_user() {
            local user="$1"; shift || true
            echo "[debug] trying SSH as '$user' ..."
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$KEY" "$user@$IP" "echo ok" >/dev/null 2>&1; then
              echo "[debug] SSH ok as '$user'"
              return 0
            else
              rc=$?
              echo "[debug] SSH failed as '$user' (rc=$rc)"
              return 1
            fi
          }

          # If user specified, try only that user
          if [ -n "$SPECIFIED_USER" ]; then
            echo "Using specified SSH user: $SPECIFIED_USER"
            if try_user "$SPECIFIED_USER"; then
              echo "ssh_user=$SPECIFIED_USER" >> $GITHUB_OUTPUT
              if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$KEY" "$SPECIFIED_USER@$IP" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
                echo "mode=deploy-ready" >> $GITHUB_OUTPUT
              else
                echo "mode=deploy-no-sudo" >> $GITHUB_OUTPUT
              fi
              exit 0
            else
              echo "Specified user '$SPECIFIED_USER' failed to connect" >&2
              exit 1
            fi
          fi

          # Auto-detect: Prefer root-like user to bootstrap 'deploy' quickly
          for U in root; do
            if try_user "$U"; then
              echo "ssh_user=$U" >> $GITHUB_OUTPUT
              echo "mode=needs-bootstrap" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          # Check if deploy user exists with sudo
          if try_user deploy; then
            echo "ssh_user=deploy" >> $GITHUB_OUTPUT
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$KEY" "deploy@$IP" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
              echo "mode=deploy-ready" >> $GITHUB_OUTPUT
            else
              echo "mode=deploy-no-sudo" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # Check for gradient user (production VMs with static certs)
          if try_user gradient; then
            echo "ssh_user=gradient" >> $GITHUB_OUTPUT
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$KEY" "gradient@$IP" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
              echo "mode=deploy-ready" >> $GITHUB_OUTPUT
            else
              echo "mode=deploy-no-sudo" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          echo "No suitable SSH user found (tried root, deploy, gradient)." >&2
          exit 1

      - name: Bootstrap/repair deploy (if needed)
        if: steps.ctrl.outputs.mode == 'needs-bootstrap'
        run: |
          set -euo pipefail
          IP=${{ inputs.ip }}
          KEY=${{ steps.ssh.outputs.key_path }}
          BOOT=${{ steps.ctrl.outputs.ssh_user }}

          ssh -o StrictHostKeyChecking=no -i "$KEY" "$BOOT@$IP" bash -s <<'REMOTE'
          set -euo pipefail

          if ! id deploy >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash -G sudo,adm deploy
          fi
          sudo install -d -m 0700 -o deploy -g deploy /home/deploy/.ssh
          if [ -r "$HOME/.ssh/authorized_keys" ]; then
            sudo install -m 0600 -o deploy -g deploy "$HOME/.ssh/authorized_keys" /home/deploy/.ssh/authorized_keys
          fi

          TMP=$(mktemp)
          cat > "$TMP" <<'SUDOERS'
          Defaults:deploy secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          deploy ALL=(ALL) NOPASSWD:ALL
          SUDOERS
          sudo visudo -cf "$TMP"
          sudo install -m 0440 "$TMP" /etc/sudoers.d/90-deploy
          sudo chown root:root /etc/sudoers.d/90-deploy
          rm -f "$TMP"

          sudo usermod -aG docker deploy || true
          echo "Deploy user bootstrapped."
          REMOTE

      - name: Wait for SSH deploy (with sudo)
        if: steps.ctrl.outputs.mode == 'deploy-ready'
        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          key=${{ steps.ssh.outputs.key_path }}
          user=${{ steps.ctrl.outputs.ssh_user }}
          for i in {1..90}; do
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$key" "$user@$ip" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
              echo "SSH $user ready"; exit 0; fi
            echo "Waiting for $user sudo ($i/90) ..."; sleep 5
          done
          echo "$user reachable but sudo -n failed." >&2; exit 1

      - name: Wait for SSH deploy after bootstrap
        if: steps.ctrl.outputs.mode == 'needs-bootstrap'
        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          key=${{ steps.ssh.outputs.key_path }}
          for i in {1..90}; do
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$key" deploy@"$ip" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
              echo "SSH deploy ready after bootstrap"; exit 0; fi
            echo "Waiting for deploy sudo after bootstrap ($i/90) ..."; sleep 5
          done
          echo "deploy reachable but sudo -n failed after bootstrap." >&2; exit 1

      - name: Determine final SSH user
        id: final_user
        run: |
          if [ "${{ steps.ctrl.outputs.mode }}" = "needs-bootstrap" ]; then
            echo "ssh_user=deploy" >> $GITHUB_OUTPUT
          else
            echo "ssh_user=${{ steps.ctrl.outputs.ssh_user }}" >> $GITHUB_OUTPUT
          fi

      - name: Bootstrap production VM (idempotent, via deploy)
        run: |
          IP=${{ inputs.ip }}
          USER=${{ steps.final_user.outputs.ssh_user }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$USER@$IP" bash -s <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          # Guard every sudo with -n to fail fast if NOPASSWD ever regresses
          sudon() { sudo -n "$@"; }

          # Ensure/refresh sudoers with the scoped list
          TMP_SUDOERS=$(mktemp)
          cat > "$TMP_SUDOERS" <<'SUDOERS'
          Defaults:deploy secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          deploy ALL=(ALL) NOPASSWD: \
            /usr/bin/docker, \
            /usr/bin/systemctl, \
            /usr/bin/journalctl, \
            /usr/bin/apt-get, \
            /usr/bin/apt, \
            /usr/sbin/usermod, \
            /usr/sbin/ufw, \
            /usr/sbin/visudo, \
            /usr/bin/install, \
            /bin/mkdir, /usr/bin/mkdir, \
            /bin/chmod, /usr/bin/chmod, \
            /bin/chown, /usr/bin/chown, \
            /usr/bin/curl, \
            /usr/bin/tar, \
            /usr/bin/tee, \
            /usr/bin/tail, \
            /usr/bin/cloud-init, \
            /bin/cp, /usr/bin/cp, \
            /bin/ls, /usr/bin/ls, \
            /usr/bin/stat, \
            /usr/bin/test, \
            /usr/bin/openssl, \
            /usr/bin/sed
          SUDOERS
          sudon visudo -cf "$TMP_SUDOERS"
          sudon install -m 0440 "$TMP_SUDOERS" /etc/sudoers.d/90-deploy
          sudon chown root:root /etc/sudoers.d/90-deploy
          rm -f "$TMP_SUDOERS"

          # Packages with retry to avoid apt locks
          set +e
          ok=""
          for i in {1..30}; do
            if sudon apt-get update -y && sudon apt-get install -y ca-certificates curl git python3 python3-pip docker.io ufw fail2ban unattended-upgrades auditd; then
              ok=1; break; fi
            echo "[keepalive] apt busy; retry $i/30"; sleep 5
          done
          set -e
          if [ -z "$ok" ]; then echo "apt install failed after retries" >&2; exit 1; fi

          # Docker Compose plugin
          if ! docker compose version >/dev/null 2>&1; then
            sudon mkdir -p /usr/lib/docker/cli-plugins
            sudon curl -sSL -o /usr/lib/docker/cli-plugins/docker-compose \
              https://github.com/docker/compose/releases/download/v2.39.1/docker-compose-linux-x86_64
            sudon chmod +x /usr/lib/docker/cli-plugins/docker-compose
          fi
          sudon usermod -aG docker deploy || true

          # SSHD hardening
          sudon mkdir -p /etc/ssh/sshd_config.d
          TS="/etc/ssh/sshd_config.d/01-hardening.conf"
          TMP_SSH=$(mktemp)
          cat > "$TMP_SSH" <<'SSHDROPIN'
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
          X11Forwarding no
          UseDNS no
          AllowUsers deploy
          SSHDROPIN
          if ! cmp -s "$TMP_SSH" "$TS" 2>/dev/null; then
            sudon install -m 0644 "$TMP_SSH" "$TS"
            sudon systemctl reload ssh || sudon systemctl reload sshd || true
          fi
          rm -f "$TMP_SSH"

          # Persistent dirs for AIRE
          sudon install -d -m 0775 -o deploy -g deploy \
            /srv/aire/letsencrypt \
            /srv/aire/certbot-www \
            /srv/aire/letsencrypt-log \
            /srv/aire/prometheus \
            /srv/aire/alertmanager \
            /srv/aire/grafana \
            /var/log/aire/nginx
          sudon chmod -R 0777 /srv/aire/certbot-www /srv/aire/letsencrypt-log /var/log/aire/nginx || true
          sudon chmod -R 0777 /srv/aire/prometheus /srv/aire/grafana /srv/aire/alertmanager || true

          # UFW baseline
          sudon ufw --force reset || true
          sudon ufw default deny incoming
          sudon ufw default allow outgoing
          sudon ufw limit 22/tcp
          sudon ufw allow 80/tcp
          sudon ufw allow 443/tcp
          sudon ufw --force enable

          # Services & unattended upgrades
          sudon systemctl enable --now docker || true
          sudon systemctl enable --now fail2ban || true
          sudon systemctl enable --now auditd || true
          echo 'APT::Periodic::Update-Package-Lists "1";'          | sudon tee /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
          echo 'APT::Periodic::Download-Upgradeable-Packages "1";' | sudon tee -a /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
          echo 'APT::Periodic::AutocleanInterval "7";'             | sudon tee -a /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
          echo 'APT::Periodic::Unattended-Upgrade "1";'            | sudon tee -a /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
          sudon systemctl enable --now unattended-upgrades || true

          # Sanity
          sudon visudo -cf /etc/sudoers.d/90-deploy
          REMOTE

      - name: Upload repository and runtime env
        env:
          API_VERSION: ${{ inputs.api_version }}
          FRONTEND_VERSION: ${{ inputs.frontend_version }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GRADIENT_MAIL: ${{ secrets.GRADIENT_MAIL }}
          POSTGRES_DB: ${{ secrets.postgres_db }}
          POSTGRES_USER: ${{ secrets.postgres_user }}
          POSTGRES_PASSWORD: ${{ secrets.postgres_password }}
          GKN_API_KEY: ${{ secrets.GKN_API_KEY }}
          VECTOR_API_URL: ${{ secrets.VECTOR_API_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          GF_SECURITY_ADMIN_USER: ${{ secrets.GF_SECURITY_ADMIN_USER }}
          GF_SECURITY_ADMIN_PASSWORD: ${{ secrets.GF_SECURITY_ADMIN_PASSWORD }}
          MODEL_PROVIDER: ${{ secrets.MODEL_PROVIDER }}
          HF_KEY: ${{ secrets.HF_KEY }}
          UBIOPS_KEY: ${{ secrets.UBIOPS_KEY }}
          FLASK_SECRET_KEY: ${{ secrets.FLASK_SECRET_KEY }}

        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          fqdn=${{ inputs.domain }}
          user=${{ steps.final_user.outputs.ssh_user }}
          owner_lc=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          git archive --format=tar.gz -o repo.tar.gz HEAD
          scp -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" repo.tar.gz "$user@$ip:/home/$user/repo.tar.gz"
          {
            printf 'FQDN=%q\n' "$fqdn"
            printf 'IP=%q\n' "$ip"
            printf 'API_VERSION=%q\n' "$API_VERSION"
            printf 'FRONTEND_VERSION=%q\n' "$FRONTEND_VERSION"
            printf 'REGISTRY=%q\n' "ghcr.io"
            printf 'IMAGE_NAME_API=%q\n' "${owner_lc}/woo-api"
            printf 'IMAGE_NAME_FRONTEND=%q\n' "${owner_lc}/woo-frontend"
            printf 'GITHUB_REPOSITORY_OWNER=%q\n' "${owner_lc}"
            printf 'GH_PAT=%q\n' "$GH_PAT"
            printf 'GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'SLACK_WEBHOOK_URL=%q\n' "$SLACK_WEBHOOK_URL"
            printf 'GRADIENT_MAIL=%q\n' "$GRADIENT_MAIL"
            # Database
            printf 'POSTGRES_DB=%q\n' "${POSTGRES_DB}"
            printf 'POSTGRES_USER=%q\n' "${POSTGRES_USER}"
            printf 'POSTGRES_PASSWORD=%q\n' "${POSTGRES_PASSWORD}"
            # API Keys
            printf 'GKN_API_KEY=%q\n' "${GKN_API_KEY}"
            printf 'HF_KEY=%q\n' "${HF_KEY}"
            printf 'UBIOPS_KEY=%q\n' "${UBIOPS_KEY}"
            printf 'FLASK_SECRET_KEY=%q\n' "${FLASK_SECRET_KEY}"
            # Vector API
            printf 'VECTOR_API_URL=%q\n' "${VECTOR_API_URL}"
            # Frontend
            printf 'FRONTEND_URL=%q\n' "${FRONTEND_URL}"
            # Admin bootstrap
            printf 'ADMIN_NAME=%q\n' "${ADMIN_NAME}"
            printf 'ADMIN_EMAIL=%q\n' "${ADMIN_EMAIL}"
            printf 'ADMIN_PASSWORD=%q\n' "${ADMIN_PASSWORD}"
            # Grafana credentials
            printf 'GF_SECURITY_ADMIN_USER=%q\n' "${GF_SECURITY_ADMIN_USER}"
            printf 'GF_SECURITY_ADMIN_PASSWORD=%q\n' "${GF_SECURITY_ADMIN_PASSWORD}"
            # Model provider
            printf 'MODEL_PROVIDER=%q\n' "${MODEL_PROVIDER}"
          } > .remote.env
          scp -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" .remote.env "$user@$ip:/home/$user/.remote.env"


      - name: Authenticate to GHCR on remote
        run: |
          ip=${{ inputs.ip }}
          user=${{ steps.final_user.outputs.ssh_user }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            HOMEDIR="$HOME"
            [ -f "$HOME/.remote.env" ] && . "$HOME/.remote.env" || true
            USERNAME="${GHCR_USERNAME:-${GITHUB_ACTOR:-}}"
            TOKEN="${GH_PAT:-}"
            if [ -z "$TOKEN" ]; then
              echo "GH_PAT not set; cannot login to GHCR." >&2
              exit 1
            fi
            mkdir -p "$HOME/.docker" && chmod 700 "$HOME/.docker"
            docker logout ghcr.io >/dev/null 2>&1 || true
            echo "$TOKEN" | docker login ghcr.io -u "$USERNAME" --password-stdin
            echo "Logged into GHCR as $USERNAME ($USER)"
            sudo mkdir -p /root/.docker && sudo chmod 700 /root/.docker
            sudo docker logout ghcr.io >/dev/null 2>&1 || true
            echo "$TOKEN" | sudo docker login ghcr.io -u "$USERNAME" --password-stdin
            echo "Logged into GHCR as $USERNAME (root)"
          '

      - name: Remote bootstrap (extract repo, set nginx server_name)
        run: |
          ip=${{ inputs.ip }}
          user=${{ steps.final_user.outputs.ssh_user }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            HOMEDIR="$HOME"
            rm -rf "$HOME/repo" && mkdir -p "$HOME/repo"
            tar -xzf "$HOME/repo.tar.gz" -C "$HOME/repo"
            cd "$HOME/repo"
            [ -f "$HOME/.remote.env" ] && . "$HOME/.remote.env" || true
            : "${FQDN:?missing FQDN in .remote.env}"
            sed -i "s/SERVER_NAME_PLACEHOLDER/${FQDN}/g" nginx/nginx.conf
            sed -i "s/SERVER_NAME_PLACEHOLDER/${FQDN}/g" nginx/nginx-acme.conf
            sed -i "s/SERVER_NAME_PLACEHOLDER/${FQDN}/g" nginx/nginx-static.conf
            sed -i "s/SERVER_NAME_PLACEHOLDER/${FQDN}/g" nginx/nginx-http-only.conf
            # Patch Grafana external URL inside compose for correct redirects
            sed -i "s#https://SERVER_NAME_PLACEHOLDER/grafana/#https://${FQDN}/grafana/#g" docker-compose.prod.yaml
            # Ensure Compose picks up environment automatically
            if [ -f "$HOME/.remote.env" ]; then
              cp -f "$HOME/.remote.env" "$HOME/repo/.env"
              chmod 0644 "$HOME/repo/.env" || true
            fi
          '

      - name: Wait for DNS propagation (A record)
        run: |
          set -euo pipefail
          fqdn=${{ inputs.domain }}
          ip=${{ inputs.ip }}
          for resolver in 1.1.1.1 8.8.8.8 9.9.9.9; do
            echo "Checking resolver $resolver for $fqdn -> $ip"
            ok=""
            for i in {1..60}; do
              resolved=$(dig +short A "$fqdn" @"$resolver" | tail -n1 || true)
              if [ "$resolved" = "$ip" ]; then ok=1; break; fi
              echo "  waiting DNS ($i/60): got '$resolved'"; sleep 5
            done
            if [ -z "$ok" ]; then echo "Resolver $resolver does not return $ip for $fqdn" >&2; exit 1; fi
          done

      - name: Install static certificate (if tls_mode=static)
        if: ${{ inputs.tls_mode == 'static' }}
        env:
          TLS_CERT_PEM_B64: ${{ secrets.TLS_CERT_PEM_B64 }}
          TLS_PRIVKEY_PEM_B64: ${{ secrets.TLS_PRIVKEY_PEM_B64 }}
        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          fqdn=${{ inputs.domain }}
          user=${{ steps.final_user.outputs.ssh_user }}
          
          echo "$TLS_CERT_PEM_B64" | base64 -d > cert.pem
          echo "$TLS_PRIVKEY_PEM_B64" | base64 -d > privkey.pem
          
          echo "Building full certificate chain..."
          cat cert.pem > fullchain.pem
          
          openssl x509 -in cert.pem -noout -text | grep -q "CA Issuers" && {
            echo "Certificate has AIA extension, attempting to fetch intermediate certificates..."
            
            temp_cert="cert.pem"
            max_depth=5
            depth=0
            
            while [ $depth -lt $max_depth ]; do
              issuer_uri=$(openssl x509 -in "$temp_cert" -noout -text | \
                grep -A1 "CA Issuers" | grep URI | sed 's/.*URI://' | tr -d ' ')
              
              if [ -z "$issuer_uri" ]; then
                echo "No more issuers found, chain complete"
                break
              fi
              
              echo "Fetching intermediate certificate from: $issuer_uri"
              
              if [[ "$issuer_uri" == *.cer ]] || [[ "$issuer_uri" == *.crt ]]; then
                curl -sS "$issuer_uri" | openssl x509 -inform DER -outform PEM >> fullchain.pem
              else
                curl -sS "$issuer_uri" | openssl x509 -inform PEM -outform PEM >> fullchain.pem
              fi
              
              temp_cert="intermediate_$depth.pem"
              tail -n +$(grep -n "BEGIN CERTIFICATE" fullchain.pem | tail -1 | cut -d: -f1) fullchain.pem > "$temp_cert"
              
              depth=$((depth + 1))
            done
          } || {
            echo "No AIA extension found, using certificate as-is"
          }
          
          echo "Certificate chain built successfully"
          
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            sudo mkdir -p /srv/aire/customcert /srv/aire/letsencrypt
            if [ ! -f /srv/aire/letsencrypt/options-ssl-nginx.conf ]; then
              sudo tee /srv/aire/letsencrypt/options-ssl-nginx.conf >/dev/null <<EOF
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers off;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
          ssl_session_timeout 1d;
          ssl_session_cache shared:SSL:10m;
          ssl_session_tickets off;
          EOF
            fi
          '
          
          scp -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" fullchain.pem privkey.pem "$user@$ip:$HOME/"
          
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            HOMEDIR="$HOME"
            sudon() { sudo -n "$@"; }
            sudon install -m 0644 "$HOME/fullchain.pem" /srv/aire/customcert/fullchain.pem
            sudon install -m 0600 "$HOME/privkey.pem"   /srv/aire/customcert/privkey.pem
            rm -f "$HOME/fullchain.pem" "$HOME/privkey.pem"
            
            echo "Verifying certificate chain..."
            sudon openssl verify -CAfile /srv/aire/customcert/fullchain.pem /srv/aire/customcert/fullchain.pem || \
              echo "Warning: Certificate chain verification failed, but will proceed anyway"
          '
          
          rm -f cert.pem privkey.pem fullchain.pem intermediate_*.pem

      - name: Configure Alertmanager secret (optional)
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          ip=${{ inputs.ip }}
          user=${{ steps.final_user.outputs.ssh_user }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            HOMEDIR="$HOME"
            cd "$HOME/repo"
            [ -f "$HOME/.remote.env" ] && . "$HOME/.remote.env" || true
            : "${SLACK_WEBHOOK_URL:=}"
            if [ -z "$SLACK_WEBHOOK_URL" ]; then echo "SLACK_WEBHOOK_URL not set; skipping"; exit 0; fi
            export SLACK_WEBHOOK_URL
            bash cicd/alertmanager-setup.sh
          '

      - name: Bootstrap Nginx with ACME and issue certificate
        if: ${{ inputs.tls_mode == 'letsencrypt' }}
        env:
          GRADIENT_MAIL: ${{ env.GRADIENT_MAIL }}
        run: |
          user=${{ steps.final_user.outputs.ssh_user }}
          ip=${{ inputs.ip }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            cd "$HOME/repo"
            [ -f "$HOME/.remote.env" ] && . "$HOME/.remote.env" || true
            : "${GRADIENT_MAIL:=}"
            if [ -z "$GRADIENT_MAIL" ]; then echo "GRADIENT_MAIL not set; skipping cert issuance"; exit 0; fi
            # Start nginx with ACME config
            sudo docker compose --env-file "$HOME/.remote.env" -f docker-compose.prod.yaml pull nginx
            sudo docker compose --env-file "$HOME/.remote.env" -f docker-compose.prod.yaml up -d --no-deps nginx
            sudo docker cp "$HOME/repo/nginx/nginx-acme.conf" nginx-prod:/etc/nginx/conf.d/default.conf
            sudo docker exec nginx-prod nginx -t
            sudo docker exec nginx-prod nginx -s reload
            # Ensure HTTP reachable
            for i in $(seq 1 60); do
              if curl -fsS "http://$FQDN/" >/dev/null 2>&1; then break; fi
              sleep 2
            done
            # Issue cert via HTTP-01 using host persistence
            sudo mkdir -p /srv/aire/letsencrypt /srv/aire/certbot-www /srv/aire/letsencrypt-log
            sudo docker run --rm \
              -v "/srv/aire/letsencrypt:/etc/letsencrypt" \
              -v "/srv/aire/certbot-www:/var/www/certbot" \
              -v "/srv/aire/letsencrypt-log:/var/log/letsencrypt" \
              certbot/certbot:latest certonly --webroot \
              -w /var/www/certbot -d "$FQDN" \
              --agree-tos --email "$GRADIENT_MAIL" --non-interactive -v
            sudo ls -l "/srv/aire/letsencrypt/live/$FQDN/fullchain.pem" "/srv/aire/letsencrypt/live/$FQDN/privkey.pem"
            '

      - name: Ensure LE TLS helper files exist
        run: |
          user=${{ steps.final_user.outputs.ssh_user }}
          IP=${{ inputs.ip }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$IP" bash -s <<'REMOTE'
          set -euo pipefail
      
          sudo mkdir -p /srv/aire/letsencrypt
      
          # 1) options-ssl-nginx.conf (Mozilla/Certbot-style)
          if [ ! -f /srv/aire/letsencrypt/options-ssl-nginx.conf ]; then
            sudo tee /srv/aire/letsencrypt/options-ssl-nginx.conf >/dev/null <<'EOF'
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers off;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
          ssl_session_timeout 1d;
          ssl_session_cache shared:SSL:10m;
          ssl_session_tickets off;
          EOF
          fi
      
          # 2) ssl-dhparams.pem (generate once)
          if [ ! -f /srv/aire/letsencrypt/ssl-dhparams.pem ]; then
            sudo openssl dhparam -out /srv/aire/letsencrypt/ssl-dhparams.pem 2048
          fi
          REMOTE

      - name: Reset stack state (keep volumes)
        run: |
          user=${{ steps.final_user.outputs.ssh_user }}
          ip=${{ inputs.ip }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            cd "$HOME/repo" || exit 0
            [ -f "$HOME/.remote.env" ] && . "$HOME/.remote.env" || true
            sudo docker compose --env-file "$HOME/.remote.env" -f docker-compose.prod.yaml down --remove-orphans || true
            sudo docker container prune -f || true
            sudo docker image prune -af || true
            sudo docker network prune -f || true
            sudo docker builder prune -af || true
          '

      - name: Deploy full stack
        run: |
          user=${{ steps.final_user.outputs.ssh_user }}
          ip=${{ inputs.ip }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            cd "$HOME/repo"
            . "$HOME/.remote.env"
            export API_VERSION
            export FRONTEND_VERSION
            sudo docker compose --env-file "$HOME/.remote.env" -f docker-compose.prod.yaml pull
            sudo docker compose --env-file "$HOME/.remote.env" -f docker-compose.prod.yaml up -d
            sudo docker compose --env-file "$HOME/.remote.env" -f docker-compose.prod.yaml ps
          '

      - name: Switch Nginx to HTTPS config (ACME or static)
        run: |
          set -euo pipefail
          user=${{ steps.final_user.outputs.ssh_user }}
          ip=${{ inputs.ip }}
          mode=${{ inputs.tls_mode }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" 'bash -s' <<'SWITCHNGINX' "$mode"
          set -euo pipefail
          cd "$HOME/repo"
          . "$HOME/.remote.env"
          if [ "$1" = "static" ]; then
            sudo docker cp nginx/nginx-static.conf nginx-prod:/etc/nginx/conf.d/default.conf
          elif [ "$1" = "letsencrypt" ]; then
            sudo docker cp nginx/nginx.conf nginx-prod:/etc/nginx/conf.d/default.conf
          elif [ "$1" = "skip" ]; then
            sudo docker cp nginx/nginx-http-only.conf nginx-prod:/etc/nginx/conf.d/default.conf
          else
            echo "Unknown TLS mode: $1" >&2
            exit 1
          fi
          sudo docker exec nginx-prod nginx -t
          sudo docker exec nginx-prod nginx -s reload
          SWITCHNGINX

      # Removed remote pytest; HTTP smoke tests below are sufficient

      - name: Smoke tests (remote)
        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          fqdn=${{ inputs.domain }}
          mode=${{ inputs.tls_mode }}
          
          # Test external endpoints
          if [ "$mode" = "skip" ]; then
            echo "Testing HTTP endpoints (TLS skipped)"
            for i in {1..60}; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" "http://$fqdn/" 2>&1 || echo "000")
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then 
                echo "Got response code: $code"
                break
              fi
              echo "Waiting for HTTP ($i/60), got code: $code"; sleep 3
            done
            curl -fsS "http://$fqdn/" >/dev/null
            curl -fsS "http://$fqdn/api/helloworld" | grep -q "Hello, World!"
            curl -fsS "http://$fqdn/api/metrics" | grep -q "app_info"
          else
            echo "Testing HTTPS endpoints"
            for i in {1..60}; do
              code=$(curl -sS -o /dev/null -w "%{http_code}" "https://$fqdn/" 2>&1 || echo "000")
              if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then 
                echo "Got response code: $code"
                break
              fi
              if [ $i -eq 60 ]; then
                echo "HTTPS health check failed after 60 attempts"
                exit 1
              fi
              echo "Waiting for HTTPS ($i/60), got code: $code"; sleep 3
            done
            curl -fsS "https://$fqdn/" >/dev/null
            curl -fsS "https://$fqdn/api/helloworld" | grep -q "Hello, World!"
            curl -fsS "https://$fqdn/api/metrics" | grep -q "app_info"
          fi
