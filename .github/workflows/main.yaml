name: Production build on IP + Domain

on:
  workflow_dispatch:
    inputs:
      ip:
        description: 'ip address of the production server'
        type: string
      domain:
        description: 'Domain of the production server'
        type: string
        default: woo-gradient.nl
      ssh_user:
        description: 'SSH user (leave empty to auto-detect: root, deploy, gradient)'
        type: string
        required: false
        default: ''
      api_version:
        description: 'API image tag to deploy'
        type: string
        default: latest
      frontend_version:
        description: 'Frontend image tag to deploy'
        type: string
        default: latest

env:
  SSH_PRIVATE_KEY_PROD: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
  GRADIENT_MAIL: ${{ secrets.GRADIENT_MAIL }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for SSH (port 22)
        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          for i in {1..60}; do
            if (echo > /dev/tcp/$ip/22) >/dev/null 2>&1; then exit 0; fi
            echo "Waiting for SSH ($i/60) ..."; sleep 5
          done
          exit 1
      - name: Prepare SSH key
        id: ssh
        env:
          SSH_PRIVATE_KEY_PROD: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY_PROD" > ~/.ssh/id_do
          chmod 600 ~/.ssh/id_do
          echo "key_path=$HOME/.ssh/id_do" >> $GITHUB_OUTPUT
      - name: Select SSH control user
        id: ctrl
        run: |
          set -euo pipefail
          IP=${{ inputs.ip }}
          KEY=${{ steps.ssh.outputs.key_path }}
          SPECIFIED_USER="${{ inputs.ssh_user }}"
          try_user() {
            local user="$1"; shift || true
            echo "[debug] trying SSH as '$user' ..."
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$KEY" "$user@$IP" "echo ok" >/dev/null 2>&1; then
              echo "[debug] SSH ok as '$user'"
              return 0
            else
              rc=$?
              echo "[debug] SSH failed as '$user' (rc=$rc)"
              return 1
            fi
          }
          # If user specified, try only that user
          if [ -n "$SPECIFIED_USER" ]; then
            echo "Using specified SSH user: $SPECIFIED_USER"
            if try_user "$SPECIFIED_USER"; then
              echo "ssh_user=$SPECIFIED_USER" >> $GITHUB_OUTPUT
              if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$KEY" "$SPECIFIED_USER@$IP" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
                echo "mode=deploy-ready" >> $GITHUB_OUTPUT
              else
                echo "mode=deploy-no-sudo" >> $GITHUB_OUTPUT
              fi
              exit 0
            else
              echo "Specified user '$SPECIFIED_USER' failed to connect" >&2
              exit 1
            fi
          fi
          # Auto-detect: Prefer root-like user to bootstrap 'deploy' quickly
          for U in root; do
            if try_user "$U"; then
              echo "ssh_user=$U" >> $GITHUB_OUTPUT
              echo "mode=needs-bootstrap" >> $GITHUB_OUTPUT
              exit 0
            fi
          done
          # Check if deploy user exists with sudo
          if try_user deploy; then
            echo "ssh_user=deploy" >> $GITHUB_OUTPUT
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$KEY" "deploy@$IP" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
              echo "mode=deploy-ready" >> $GITHUB_OUTPUT
            else
              echo "mode=deploy-no-sudo" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi
          # Check for gradient user (production VMs with static certs)
          if try_user gradient; then
            echo "ssh_user=gradient" >> $GITHUB_OUTPUT
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$KEY" "gradient@$IP" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
              echo "mode=deploy-ready" >> $GITHUB_OUTPUT
            else
              echo "mode=deploy-no-sudo" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi
          echo "No suitable SSH user found (tried root, deploy, gradient)." >&2
          exit 1
      - name: Bootstrap/repair deploy (if needed)
        if: steps.ctrl.outputs.mode == 'needs-bootstrap'
        run: |
          set -euo pipefail
          IP=${{ inputs.ip }}
          KEY=${{ steps.ssh.outputs.key_path }}
          BOOT=${{ steps.ctrl.outputs.ssh_user }}
          ssh -o StrictHostKeyChecking=no -i "$KEY" "$BOOT@$IP" bash -s <<'REMOTE'
          set -euo pipefail
          if ! id deploy >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash -G sudo,adm deploy
          fi
          sudo install -d -m 0700 -o deploy -g deploy /home/deploy/.ssh
          if [ -r "$HOME/.ssh/authorized_keys" ]; then
            sudo install -m 0600 -o deploy -g deploy "$HOME/.ssh/authorized_keys" /home/deploy/.ssh/authorized_keys
          fi
          TMP=$(mktemp)
          cat > "$TMP" <<'SUDOERS'
          Defaults:deploy secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          deploy ALL=(ALL) NOPASSWD:ALL
          SUDOERS
          sudo visudo -cf "$TMP"
          sudo install -m 0440 "$TMP" /etc/sudoers.d/90-deploy
          sudo chown root:root /etc/sudoers.d/90-deploy
          rm -f "$TMP"
          sudo usermod -aG docker deploy || true
          echo "Deploy user bootstrapped."
          REMOTE
      - name: Wait for SSH deploy (with sudo)
        if: steps.ctrl.outputs.mode == 'deploy-ready'
        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          key=${{ steps.ssh.outputs.key_path }}
          user=${{ steps.ctrl.outputs.ssh_user }}
          for i in {1..90}; do
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$key" "$user@$ip" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
              echo "SSH $user ready"; exit 0; fi
            echo "Waiting for $user sudo ($i/90) ..."; sleep 5
          done
          echo "$user reachable but sudo -n failed." >&2; exit 1
      - name: Wait for SSH deploy after bootstrap
        if: steps.ctrl.outputs.mode == 'needs-bootstrap'
        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          key=${{ steps.ssh.outputs.key_path }}
          for i in {1..90}; do
            if ssh -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=5 -i "$key" deploy@"$ip" "sudo -n /usr/bin/ls /" >/dev/null 2>&1; then
              echo "SSH deploy ready after bootstrap"; exit 0; fi
            echo "Waiting for deploy sudo after bootstrap ($i/90) ..."; sleep 5
          done
          echo "deploy reachable but sudo -n failed after bootstrap." >&2; exit 1
      - name: Determine final SSH user
        id: final_user
        run: |
          if [ "${{ steps.ctrl.outputs.mode }}" = "needs-bootstrap" ]; then
            echo "ssh_user=deploy" >> $GITHUB_OUTPUT
          else
            echo "ssh_user=${{ steps.ctrl.outputs.ssh_user }}" >> $GITHUB_OUTPUT
          fi
      - name: Bootstrap production VM (idempotent, via deploy)
        run: |
          IP=${{ inputs.ip }}
          USER=${{ steps.final_user.outputs.ssh_user }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$USER@$IP" bash -s <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          # Guard every sudo with -n to fail fast if NOPASSWD ever regresses
          sudon() { sudo -n "$@"; }
          # Ensure/refresh sudoers with the scoped list
          TMP_SUDOERS=$(mktemp)
          cat > "$TMP_SUDOERS" <<'SUDOERS'
          Defaults:deploy secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          deploy ALL=(ALL) NOPASSWD: \
            /usr/bin/docker, \
            /usr/bin/systemctl, \
            /usr/bin/journalctl, \
            /usr/bin/apt-get, \
            /usr/bin/apt, \
            /usr/sbin/usermod, \
            /usr/sbin/ufw, \
            /usr/sbin/visudo, \
            /usr/bin/install, \
            /bin/mkdir, /usr/bin/mkdir, \
            /bin/chmod, /usr/bin/chmod, \
            /bin/chown, /usr/bin/chown, \
            /usr/bin/curl, \
            /usr/bin/tar, \
            /usr/bin/tee, \
            /usr/bin/tail, \
            /usr/bin/cloud-init, \
            /bin/cp, /usr/bin/cp, \
            /bin/ls, /usr/bin/ls, \
            /usr/bin/stat, \
            /usr/bin/test, \
            /usr/bin/openssl, \
            /usr/bin/sed
          SUDOERS
          sudon visudo -cf "$TMP_SUDOERS"
          sudon install -m 0440 "$TMP_SUDOERS" /etc/sudoers.d/90-deploy
          sudon chown root:root /etc/sudoers.d/90-deploy
          rm -f "$TMP_SUDOERS"
          # Packages with retry to avoid apt locks
          set +e
          ok=""
          for i in {1..30}; do
            if sudon apt-get update -y && sudon apt-get install -y ca-certificates curl git python3 python3-pip docker.io ufw fail2ban unattended-upgrades auditd; then
              ok=1; break; fi
            echo "[keepalive] apt busy; retry $i/30"; sleep 5
          done
          set -e
          if [ -z "$ok" ]; then echo "apt install failed after retries" >&2; exit 1; fi
          # Docker Compose plugin
          if ! docker compose version >/dev/null 2>&1; then
            sudon mkdir -p /usr/lib/docker/cli-plugins
            sudon curl -sSL -o /usr/lib/docker/cli-plugins/docker-compose \
              https://github.com/docker/compose/releases/download/v2.39.1/docker-compose-linux-x86_64
            sudon chmod +x /usr/lib/docker/cli-plugins/docker-compose
          fi
          sudon usermod -aG docker deploy || true
          # SSHD hardening
          sudon mkdir -p /etc/ssh/sshd_config.d
          TS="/etc/ssh/sshd_config.d/01-hardening.conf"
          TMP_SSH=$(mktemp)
          cat > "$TMP_SSH" <<'SSHDROPIN'
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
          X11Forwarding no
          UseDNS no
          AllowUsers deploy
          SSHDROPIN
          if ! cmp -s "$TMP_SSH" "$TS" 2>/dev/null; then
            sudon install -m 0644 "$TMP_SSH" "$TS"
            sudon systemctl reload ssh || sudon systemctl reload sshd || true
          fi
          rm -f "$TMP_SSH"
          # Persistent dirs for WOO
          sudon install -d -m 0775 -o deploy -g deploy \
            /srv/woo/letsencrypt \
            /srv/woo/certbot-www \
            /srv/woo/letsencrypt-log \
            /var/log/woo/nginx
          sudon chmod -R 0777 /srv/woo/certbot-www /srv/woo/letsencrypt-log /var/log/woo/nginx || true
          # UFW baseline
          sudon ufw --force reset || true
          sudon ufw default deny incoming
          sudon ufw default allow outgoing
          sudon ufw limit 22/tcp
          sudon ufw allow 80/tcp
          sudon ufw allow 443/tcp
          sudon ufw --force enable
          # Services & unattended upgrades
          sudon systemctl enable --now docker || true
          sudon systemctl enable --now fail2ban || true
          sudon systemctl enable --now auditd || true
          echo 'APT::Periodic::Update-Package-Lists "1";'          | sudon tee /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
          echo 'APT::Periodic::Download-Upgradeable-Packages "1";' | sudon tee -a /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
          echo 'APT::Periodic::AutocleanInterval "7";'             | sudon tee -a /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
          echo 'APT::Periodic::Unattended-Upgrade "1";'            | sudon tee -a /etc/apt/apt.conf.d/20auto-upgrades >/dev/null
          sudon systemctl enable --now unattended-upgrades || true
          # Sanity
          sudon visudo -cf /etc/sudoers.d/90-deploy
          REMOTE
      - name: Upload repository and runtime env
        env:
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          MICROSOFT_TENANT_ID: ${{ secrets.MICROSOFT_TENANT_ID }}
          MICROSOFT_REDIRECT_URI: ${{ secrets.MICROSOFT_REDIRECT_URI }}

        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          fqdn=${{ inputs.domain }}
          user=${{ steps.final_user.outputs.ssh_user }}
          git archive --format=tar.gz -o repo.tar.gz HEAD
          scp -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" repo.tar.gz "$user@$ip:/home/$user/repo.tar.gz"
          
          # Create backend/.env with Microsoft OAuth credentials
          {
            printf 'MICROSOFT_CLIENT_ID=%q\n' "${MICROSOFT_CLIENT_ID}"
            printf 'MICROSOFT_CLIENT_SECRET=%q\n' "${MICROSOFT_CLIENT_SECRET}"
            printf 'MICROSOFT_TENANT_ID=%q\n' "${MICROSOFT_TENANT_ID}"
            printf 'MICROSOFT_REDIRECT_URI=%q\n' "${MICROSOFT_REDIRECT_URI}"
          } > backend.env
          scp -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" backend.env "$user@$ip:/home/$user/backend.env"
          
          # Store FQDN for nginx config
          echo "FQDN=$fqdn" > fqdn.env
          scp -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" fqdn.env "$user@$ip:/home/$user/fqdn.env"
          
      - name: Remote bootstrap (extract repo, set nginx server_name)
        run: |
          ip=${{ inputs.ip }}
          user=${{ steps.final_user.outputs.ssh_user }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            HOMEDIR="$HOME"
            rm -rf "$HOME/repo" && mkdir -p "$HOME/repo"
            tar -xzf "$HOME/repo.tar.gz" -C "$HOME/repo"
            cd "$HOME/repo"
            
            # Load FQDN for nginx config
            [ -f "$HOME/fqdn.env" ] && . "$HOME/fqdn.env" || true
            : "${FQDN:?missing FQDN in fqdn.env}"
            sed -i "s/SERVER_NAME_PLACEHOLDER/${FQDN}/g" nginx/nginx.conf
            sed -i "s/SERVER_NAME_PLACEHOLDER/${FQDN}/g" nginx/nginx-acme.conf
            
            # Place backend.env into backend/.env
            if [ -f "$HOME/backend.env" ]; then
              mkdir -p "$HOME/repo/backend"
              cp -f "$HOME/backend.env" "$HOME/repo/backend/.env"
              chmod 0644 "$HOME/repo/backend/.env" || true
            fi
          '
      - name: Wait for DNS propagation (A record)
        run: |
          set -euo pipefail
          fqdn=${{ inputs.domain }}
          ip=${{ inputs.ip }}
          for resolver in 1.1.1.1 8.8.8.8 9.9.9.9; do
            echo "Checking resolver $resolver for $fqdn -> $ip"
            ok=""
            for i in {1..60}; do
              resolved=$(dig +short A "$fqdn" @"$resolver" | tail -n1 || true)
              if [ "$resolved" = "$ip" ]; then ok=1; break; fi
              echo "  waiting DNS ($i/60): got '$resolved'"; sleep 5
            done
            if [ -z "$ok" ]; then echo "Resolver $resolver does not return $ip for $fqdn" >&2; exit 1; fi
          done
      - name: Bootstrap Nginx with ACME and issue certificate
        env:
          GRADIENT_MAIL: ${{ env.GRADIENT_MAIL }}
        run: |
          user=${{ steps.final_user.outputs.ssh_user }}
          ip=${{ inputs.ip }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            cd "$HOME/repo"
            
            # Load FQDN
            [ -f "$HOME/fqdn.env" ] && . "$HOME/fqdn.env" || true
            : "${GRADIENT_MAIL:=}"
            if [ -z "$GRADIENT_MAIL" ]; then echo "GRADIENT_MAIL not set; skipping cert issuance"; exit 0; fi
            
            # Start nginx with ACME config
            sudo docker compose -f docker-compose.prod.yaml pull nginx
            sudo docker compose -f docker-compose.prod.yaml up -d --no-deps nginx
            sudo docker cp "$HOME/repo/nginx/nginx-acme.conf" nginx-prod:/etc/nginx/conf.d/default.conf
            sudo docker exec nginx-prod nginx -t
            sudo docker exec nginx-prod nginx -s reload
            
            # Ensure HTTP reachable
            for i in $(seq 1 60); do
              if curl -fsS "http://$FQDN/" >/dev/null 2>&1; then break; fi
              sleep 2
            done
            
            # Issue cert via HTTP-01 using host persistence
            sudo mkdir -p /srv/woo/letsencrypt /srv/woo/certbot-www /srv/woo/letsencrypt-log
            sudo docker run --rm \
              -v "/srv/woo/letsencrypt:/etc/letsencrypt" \
              -v "/srv/woo/certbot-www:/var/www/certbot" \
              -v "/srv/woo/letsencrypt-log:/var/log/letsencrypt" \
              certbot/certbot:latest certonly --webroot \
              -w /var/www/certbot -d "$FQDN" \
              --agree-tos --email "$GRADIENT_MAIL" --non-interactive -v
            sudo ls -l "/srv/woo/letsencrypt/live/$FQDN/fullchain.pem" "/srv/woo/letsencrypt/live/$FQDN/privkey.pem"
            '
      - name: Ensure LE TLS helper files exist
        run: |
          user=${{ steps.final_user.outputs.ssh_user }}
          IP=${{ inputs.ip }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$IP" bash -s <<'REMOTE'
          set -euo pipefail
      
          sudo mkdir -p /srv/woo/letsencrypt

          # 1) options-ssl-nginx.conf (Mozilla/Certbot-style)
          if [ ! -f /srv/woo/letsencrypt/options-ssl-nginx.conf ]; then
            sudo tee /srv/woo/letsencrypt/options-ssl-nginx.conf >/dev/null <<'EOF'
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers off;
          ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
          ssl_session_timeout 1d;
          ssl_session_cache shared:SSL:10m;
          ssl_session_tickets off;
          EOF
          fi

          # 2) ssl-dhparams.pem (generate once)
          if [ ! -f /srv/woo/letsencrypt/ssl-dhparams.pem ]; then
            sudo openssl dhparam -out /srv/woo/letsencrypt/ssl-dhparams.pem 2048
          fi
          REMOTE

      - name: Reset stack state (keep volumes)
        run: |
          user=${{ steps.final_user.outputs.ssh_user }}
          ip=${{ inputs.ip }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            cd "$HOME/repo" || exit 0
            sudo docker compose -f docker-compose.prod.yaml down --remove-orphans || true
            sudo docker container prune -f || true
            sudo docker image prune -af || true
            sudo docker network prune -f || true
            sudo docker builder prune -af || true
          '
      - name: Deploy full stack
        run: |
          user=${{ steps.final_user.outputs.ssh_user }}
          ip=${{ inputs.ip }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            cd "$HOME/repo"
            sudo docker compose -f docker-compose.prod.yaml pull
            sudo docker compose -f docker-compose.prod.yaml up -d
            sudo docker compose -f docker-compose.prod.yaml ps
          '
      - name: Switch Nginx to HTTPS config
        run: |
          set -euo pipefail
          user=${{ steps.final_user.outputs.ssh_user }}
          ip=${{ inputs.ip }}
          ssh -o StrictHostKeyChecking=no -i "${{ steps.ssh.outputs.key_path }}" "$user@$ip" bash -lc '
            set -euo pipefail
            cd "$HOME/repo"
            sudo docker cp nginx/nginx.conf nginx-prod:/etc/nginx/conf.d/default.conf
            sudo docker exec nginx-prod nginx -t
            sudo docker exec nginx-prod nginx -s reload
          '

      - name: Smoke tests (HTTPS endpoints)
        run: |
          set -euo pipefail
          ip=${{ inputs.ip }}
          fqdn=${{ inputs.domain }}
          
          echo "Testing HTTPS endpoints"
          for i in {1..60}; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://$fqdn/" 2>&1 || echo "000")
            if [ "$code" -ge 200 ] && [ "$code" -lt 500 ]; then 
              echo "Got response code: $code"
              break
            fi
            if [ $i -eq 60 ]; then
              echo "HTTPS health check failed after 60 attempts"
              exit 1
            fi
            echo "Waiting for HTTPS ($i/60), got code: $code"; sleep 3
          done
          
          echo "Running endpoint tests..."
          curl -fsS "https://$fqdn/" >/dev/null
          echo "✓ Frontend accessible"
          
          curl -fsS "https://$fqdn/api/helloworld" | grep -q "Hello, World!"
          echo "✓ API endpoint working"
          
          echo "All smoke tests passed!"