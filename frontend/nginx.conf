# nginx config for serving the built SPA.
# Designed to run as a non-root user against a read-only root filesystem
# (the Helm chart sets runAsNonRoot/uid 1000 + readOnlyRootFilesystem: true,
# with only /tmp writable) — so the pid file and all temp paths live under /tmp,
# and logs go to stdout/stderr.

worker_processes  auto;
pid               /tmp/nginx.pid;
error_log         /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout  65;

    # Keep every writable path under /tmp (the only writable mount).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript
                  text/xml application/xml application/xml+rss text/javascript
                  image/svg+xml;

    server {
        listen      3000;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        # SPA routing: serve index.html for any unmatched path so client-side
        # routes (react-router) resolve.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Cache fingerprinted static assets aggressively.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
