  /email/sent/sync-all-replies:
    post:
      tags:
        - email
      summary: Sync All Email Replies
      description: |-
        Sync replies from Outlook for all sent emails by a user.

        This endpoint fetches new replies from Outlook for all sent emails
        that have a conversation ID, saves them to the database, performs
        sentiment analysis, and updates stakeholder publication status.

        Args:
            user_id: User identifier
            threshold: Confidence threshold for sentiment classification (default: 0.5)

        Returns:
            Sync status with total counts of new and updated replies
      operationId: sync_all_email_replies_email_sent_sync_all_replies_post
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            title: User Id
        - name: threshold
          in: query
          required: false
          schema:
            type: number
            default: 0.5
            title: Threshold
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncRepliesResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/inbox/messages:
    get:
      tags:
        - email
      summary: Get Inbox Messages
      description: |-
        Get recent inbox messages for debugging reply detection.

        Args:
            user_id: User identifier
            top: Number of messages to return (max 50)
            filter_replies: If provided, only show messages that start with "Re: [filter_replies]"

        Returns:
