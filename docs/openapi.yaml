openapi: 3.1.0
info:
  title: WOO Backend
  version: 0.1.0
paths:
  /health:
    get:
      summary: Health Check
      description: Health check endpoint
      operationId: health_check_health_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
  /transform:
    post:
      summary: Transform
      description: Transform text by randomly changing words
      operationId: transform_transform_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextInput'
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TextOutput'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/login:
    post:
      summary: Login
      description: Login - finds user by username or email
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      summary: Logout
      description: Dummy logout - always succeeds
      operationId: logout_auth_logout_post
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
  /auth/me:
    get:
      summary: Get Current User
      description: Get current user - returns the first user for now
      operationId: get_current_user_auth_me_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
  /workspaces:
    get:
      summary: Get Workspaces
      description: Get all workspaces
      operationId: get_workspaces_workspaces_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
    post:
      summary: Create Workspace
      description: Create a new workspace
      operationId: create_workspace_workspaces_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkspaceResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /workspaces/{workspace_id}:
    get:
      summary: Get Workspace Detail
      description: Get detailed workspace information
      operationId: get_workspace_detail_workspaces__workspace_id__get
      parameters:
        - name: workspace_id
          in: path
          required: true
          schema:
            type: string
            title: Workspace Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceDetailResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases:
    get:
      summary: Get Cases
      description: Get all cases
      operationId: get_cases_cases_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseListResponse'
    post:
      summary: Create Case
      description: Create a new case
      operationId: create_case_cases_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCaseRequest'
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateCaseResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/{case_id}:
    get:
      summary: Get Case Detail
      description: Get detailed case information
      operationId: get_case_detail_cases__case_id__get
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            title: Case Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseDetailResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/{case_id}/stakeholders:
    get:
      summary: Get Case Stakeholders
      description: Get all unique stakeholders for a case
      operationId: get_case_stakeholders_cases__case_id__stakeholders_get
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            title: Case Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderListResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /cases/{case_id}/overview:
    get:
      summary: Get Case Overview
      description: |-
        Get comprehensive overview of case including document status, objected chunks, and stakeholder responses.

        This endpoint provides:
        - Status of each document (ok vs has objections)
        - List of objected chunks with stakeholder information
        - Response status of each stakeholder
        - Overall case completion status
      operationId: get_case_overview_cases__case_id__overview_get
      parameters:
        - name: case_id
          in: path
          required: true
          schema:
            type: string
            title: Case Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseOverviewResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /documents:
    get:
      summary: Get Documents
      description: Get all documents
      operationId: get_documents_documents_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
  /documents/{document_id}:
    get:
      summary: Get Document Detail
      description: Get detailed document information with chunks and stakeholder mentions, optionally filtered by case for verification status
      operationId: get_document_detail_documents__document_id__get
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            title: Document Id
        - name: case_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Case Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetail'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /documents/{document_id}/pdf:
    get:
      summary: Get Document Pdf
      description: Serve the PDF file for a document
      operationId: get_document_pdf_documents__document_id__pdf_get
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            title: Document Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /documents/{document_id}/chunks:
    get:
      summary: Get Document Chunks
      description: Get all chunks for a document with stakeholder mentions, optionally filtered by case for verification status
      operationId: get_document_chunks_documents__document_id__chunks_get
      parameters:
        - name: document_id
          in: path
          required: true
          schema:
            type: string
            title: Document Id
        - name: case_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Case Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChunkListResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /documents/upload:
    post:
      summary: Upload Document
      description: Upload a PDF document to a case
      operationId: upload_document_documents_upload_post
      parameters:
        - name: case_id
          in: query
          required: true
          schema:
            type: string
            title: Case Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_document_documents_upload_post'
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadDocumentResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stakeholders:
    get:
      summary: Get Stakeholders
      description: Get all stakeholders
      operationId: get_stakeholders_stakeholders_get
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StakeholderListResponse'
    post:
      summary: Create Stakeholder
      description: Create a new stakeholder
      operationId: create_stakeholder_stakeholders_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStakeholderRequest'
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateStakeholderResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stakeholders/{stakeholder_id}:
    get:
      summary: Get Stakeholder
      description: Get a stakeholder by ID
      operationId: get_stakeholder_stakeholders__stakeholder_id__get
      parameters:
        - name: stakeholder_id
          in: path
          required: true
          schema:
            type: string
            title: Stakeholder Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleStakeholderResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /stakeholders/{stakeholder_id}/publication-status:
    patch:
      summary: Update Stakeholder Publication Status
      description: Update a stakeholder's publication status
      operationId: update_stakeholder_publication_status_stakeholders__stakeholder_id__publication_status_patch
      parameters:
        - name: stakeholder_id
          in: path
          required: true
          schema:
            type: string
            title: Stakeholder Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStakeholderPublicationStatusRequest'
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleStakeholderResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/authorize:
    get:
      tags:
        - email
      summary: Get Authorization Url
      description: |-
        Generate Microsoft OAuth authorization URL.

        Args:
            user_id: User identifier to associate with the OAuth flow

        Returns:
            Authorization URL and state parameter
      operationId: get_authorization_url_email_authorize_get
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            title: User Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUrlResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/callback:
    get:
      tags:
        - email
      summary: Oauth Callback
      description: |-
        Handle OAuth callback from Microsoft.

        Args:
            code: Authorization code from Microsoft
            state: State parameter (user_id)
            error: Error message if authorization failed

        Returns:
            Success status and user information
      operationId: oauth_callback_email_callback_get
      parameters:
        - name: code
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Code
        - name: state
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: State
        - name: error
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Error
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthCallbackResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/status:
    get:
      tags:
        - email
      summary: Get Token Status
      description: |-
        Check if user has valid email access token.

        Args:
            user_id: User identifier

        Returns:
            Token status and user email if available
      operationId: get_token_status_email_status_get
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            title: User Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenStatusResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/send:
    post:
      tags:
        - email
      summary: Send Email
      description: |-
        Send an email via Microsoft Outlook.

        Args:
            user_id: User identifier
            email_request: Email content and recipients
            case_id: Optional case ID to associate with this email
            stakeholder_id: Optional stakeholder ID to associate with this email

        Returns:
            Success status and message ID
      operationId: send_email_email_send_post
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            title: User Id
        - name: case_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Case Id
        - name: stakeholder_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Stakeholder Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/send/woo:
    post:
      tags:
        - email
      summary: Send Woo Email
      description: |-
        Send a WOO (verzoek om inzage) email via Microsoft Outlook with template.

        The email body is automatically generated from the provided template fields
        (recipientName, requestDescription, chunks, senderName).

        Args:
            user_id: User identifier
            email_request: WOO email request with template data
            case_id: Optional case ID to associate with this email

        Returns:
            Success status and message ID
      operationId: send_woo_email_email_send_woo_post
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            title: User Id
        - name: case_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Case Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendWOOEmailRequest'
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/send/stakeholder:
    post:
      tags:
        - email
      summary: Send Stakeholder Email
      description: |-
        Send an email to a stakeholder based on their mentions in case documents.

        Args:
            request: Stakeholder email request with content type and recipients

        Returns:
            Success status and message ID
      operationId: send_stakeholder_email_email_send_stakeholder_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendStakeholderEmailRequest'
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmailResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/messages:
    get:
      tags:
        - email
      summary: Get Emails
      description: |-
        Read emails from user's mailbox.

        Args:
            user_id: User identifier
            folder: Mail folder (inbox, sentitems, drafts, etc.)
            top: Number of emails to return (max 100)
            skip: Number of emails to skip
            filter_query: OData filter query (e.g., "isRead eq false")

        Returns:
            List of email messages
      operationId: get_emails_email_messages_get
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            title: User Id
        - name: folder
          in: query
          required: false
          schema:
            type: string
            default: inbox
            title: Folder
        - name: top
          in: query
          required: false
          schema:
            type: integer
            default: 10
            title: Top
        - name: skip
          in: query
          required: false
          schema:
            type: integer
            default: 0
            title: Skip
        - name: filter_query
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Filter Query
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailListResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/messages/{message_id}:
    get:
      tags:
        - email
      summary: Get Email Detail
      description: |-
        Get detailed information about a specific email.

        Args:
            user_id: User identifier
            message_id: Email message ID

        Returns:
            Detailed email information including full body
      operationId: get_email_detail_email_messages__message_id__get
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            title: Message Id
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            title: User Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/messages/{message_id}/read:
    post:
      tags:
        - email
      summary: Mark Email As Read
      description: |-
        Mark an email as read or unread.

        Args:
            user_id: User identifier
            message_id: Email message ID
            is_read: True to mark as read, False to mark as unread

        Returns:
            Success status
      operationId: mark_email_as_read_email_messages__message_id__read_post
      parameters:
        - name: message_id
          in: path
          required: true
          schema:
            type: string
            title: Message Id
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            title: User Id
        - name: is_read
          in: query
          required: false
          schema:
            type: boolean
            default: true
            title: Is Read
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/revoke:
    delete:
      tags:
        - email
      summary: Revoke Access
      description: |-
        Revoke email access for a user (remove stored tokens).

        Args:
            user_id: User identifier

        Returns:
            Success status
      operationId: revoke_access_email_revoke_delete
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
            title: User Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema: {}
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/sent:
    get:
      tags:
        - email
      summary: Get Sent Emails List
      description: |-
        Get list of sent emails, optionally filtered by user_id or case_id.

        Args:
            user_id: Optional user identifier to filter by
            case_id: Optional case identifier to filter by

        Returns:
            List of sent emails
      operationId: get_sent_emails_list_email_sent_get
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: User Id
        - name: case_id
          in: query
          required: false
          schema:
            anyOf:
              - type: string
              - type: "null"
            title: Case Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentEmailListResponse'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/sent/{email_id}:
    get:
      tags:
        - email
      summary: Get Sent Email Detail
      description: |-
        Get detailed information about a sent email including all replies.

        Args:
            email_id: Sent email identifier

        Returns:
            Detailed sent email information with replies
      operationId: get_sent_email_detail_email_sent__email_id__get
      parameters:
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            title: Email Id
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SentEmailDetail'
        "422":
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /email/sent/{email_id}/sync-replies:
    post:
      tags:
        - email
      summary: Sync Email Replies
      description: |-
        Sync replies from Outlook for a specific sent email.

        This endpoint fetches new replies from Outlook based on the conversation ID,
        saves them to the database, performs sentiment analysis, and updates stakeholder
        publication status based on the analysis result.

        Args:
            email_id: Sent email identifier
            threshold: Confidence threshold for sentiment classification (default: 0.5)
                       - If confidence >= threshold: classification is accepted
                       - If confidence < threshold: treated as uncertain/disagree

        Returns:
            Sync status with counts of new and updated replies
      operationId: sync_email_replies_email_sent__email_id__sync_replies_post
      parameters:
        - name: email_id
          in: path
          required: true
          schema:
            type: string
            title: Email Id
        - name: threshold
          in: query
          required: false
          schema:
            type: number
            default: 0.5
            title: Threshold
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
