[project]
name = "woo-server"
version = "0.1.0"
description = "WOO Backend Server"
requires-python = ">=3.11"

# Direct runtime dependencies. The ML stack (torch/spacy/transformers/pymupdf)
# stays exact-pinned for reproducibility; security-sensitive packages use a
# lower bound so uv resolves the latest patched release (exact versions are
# captured in uv.lock). Bounds below were raised to clear Trivy HIGH/CRITICAL
# CVEs (starlette/fastapi, python-multipart, langchain-core, msal+cryptography).
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]==0.24.0",
    "pydantic[email]==2.12.3",
    "pydantic-settings==2.0.3",
    "python-dotenv==1.0.0",
    "python-multipart>=0.0.27",
    "starlette>=0.49.1",
    "cryptography>=46.0.5",
    "langchain-core>=1.2.22",
    "langchain-pymupdf4llm>=0.5.0",
    "PyMuPDF>=1.26.6",
    "spacy==3.8.7",
    "transformers==4.48.0",
    "torch==2.9.0",
    "sentencepiece==0.2.1",
    # Required by the HuggingFace SentencePiece tokenizers (xlm-roberta /
    # robbert NER models) to build the fast tokenizer; was previously pulled in
    # transitively. Pinned >=6.33.5 to stay clear of the Trivy CVE.
    "protobuf>=6.33.5",
    "msal>=1.32.0",
    "requests==2.31.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "ruff",
]

# Pull torch from the PyTorch CPU index on Linux (the container runs NER on
# device=-1, so the CUDA wheel is dead weight). On macOS/Windows torch resolves
# from PyPI, whose default wheel is already CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["server*"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
